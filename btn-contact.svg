<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 64"
     width="272" height="64" role="img" aria-label="CONTACT">
<defs>
  <style>
    @font-face { font-family:"TermMono"; src:url(data:font/ttf;base64,) format("truetype"); font-weight:700; }
    text { font-family:"TermMono","Courier New",monospace; font-size:19px;
            font-weight:700; fill:#2fff6b; }
  </style>
  <filter id="g" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="s" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1.4" fill="#000" opacity="0.4"/>
  </pattern>
</defs>
<rect x="1.5" y="1.5" width="269" height="61" rx="5" fill="#050f07"
      stroke="#1c6b34" stroke-width="1.5"/>
<text filter="url(#g)" x="73.1 96.0 107.4 118.8 130.3 141.7 153.2 164.6 187.5" y="39.0">[CONTACT]</text>
<rect x="1.5" y="1.5" width="269" height="61" rx="5" fill="url(#s)"/>
</svg>
