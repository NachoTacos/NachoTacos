<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 64"
     width="272" height="64" role="img" aria-label="SKILLS">
<defs>
  <style>
    @font-face { font-family:"TermMono"; src:url(data:font/ttf;base64,) format("truetype"); font-weight:400; }
    text { font-family:"TermMono","Courier New",monospace; font-size:19px;
            font-weight:400; fill:#2fff6b; }
  </style>
  <filter id="g" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="a"/>
    <feComponentTransfer in="a" result="halo">
      <feFuncA type="linear" slope="0.35"/>
    </feComponentTransfer>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="s" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1.4" fill="#000" opacity="0.4"/>
  </pattern>
</defs>
<rect x="1.5" y="1.5" width="269" height="61" rx="5" fill="#050f07"
      stroke="#1c6b34" stroke-width="1.5"/>
<text filter="url(#g)" x="84.7 105.2 115.5 125.7 136.0 146.3 156.5 177.0" y="39.0">[SKILLS]</text>
<rect x="1.5" y="1.5" width="269" height="61" rx="5" fill="url(#s)"/>
</svg>
